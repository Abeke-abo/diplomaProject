spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/remotep}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-before-production}
app.seed-admin.enabled=${SEED_ADMIN_ENABLED:true}
