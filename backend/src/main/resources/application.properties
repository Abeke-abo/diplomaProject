server.port=5000
spring.application.name=remotep-backend
spring.profiles.default=postgres

spring.datasource.url=jdbc:h2:file:./data/remotep;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-before-production}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:30}
app.refresh-token-days=${REFRESH_TOKEN_DAYS:14}

app.seed-admin.enabled=${SEED_ADMIN_ENABLED:true}
app.seed-admin.email=${ADMIN_EMAIL:admin@remotep.local}
app.seed-admin.password=${ADMIN_PASSWORD:change-me-admin-password}
app.seed-admin.name=${ADMIN_NAME:RemoteP Admin}

app.telegram.enabled=${TELEGRAM_ENABLED:false}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}
app.telegram.api-url=${TELEGRAM_API_URL:https://api.telegram.org}

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
